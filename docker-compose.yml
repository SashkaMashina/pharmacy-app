version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: pharmacy-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=pharmacy_db
    volumes:
      - pharmacy_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pharmacy_network

  backend:
    build:
      context: ./backend
    container_name: pharmacy-backend
    depends_on:
      - db
      - db-init
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=pharmacy_db
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db/pharmacy_db
      - SECRET_KEY=supersecretkey123
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    networks:
      - pharmacy_network

  db-init:
    build:
      context: ./backend
    container_name: pharmacy-db-init
    depends_on:
      - db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=pharmacy_db
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db/pharmacy_db
    networks:
      - pharmacy_network
    command: >
      sh -c "
        echo ' Waiting for DB...' &&
        sleep 5 &&
        alembic upgrade head &&
        echo ' Migrations done!' &&
        python app/utils/seed_db.py &&
        echo ' Seed completed!'
      "

networks:
  pharmacy_network:
    driver: bridge

volumes:
  pharmacy_db_data:
